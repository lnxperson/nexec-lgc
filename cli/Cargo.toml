[package]
name = "nexec-lgc"
version = "0.1.0"
edition = "2024"
authors = ["person134"]
description = "nexec-lgc BIOS boot manager installer and management CLI"
license = "MIT"
repository = "https://github.com/person134/nexec-lgc.git"
readme = "README.md"
keywords = ["bios", "bootloader", "boot-manager", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "nexec-lgc"
path = "src/main.rs"
